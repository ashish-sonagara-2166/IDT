<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDT-2</title>
    <link rel="stylesheet" href="{{url_for('static', filename='idt.css')}}">
</head>
<body>
    <header>
        <div id="header_container">
            <a href="">
                <img src="hospitallogo.png" alt="our hospital logo" style="height: 75px; width: 75px;margin-top: 5px;">
            </a>
            <nav class="header_nav_bar">
                <div class="line">
                    <a href="index.html">Home</a>
                </div>
                <div class="line">
                    <a href="#">Contact</a>
                </div>
                <div class="line">
                    <a href="#">About Us</a>
                </div>
                <div class="line">
                    <a href="#">Services</a>
                </div>
            </nav>
            <div class="hospital_names">
                <select name="hospitals" id="hospital"
                    style="height: 35px;width: 90px; font-size: 15px;border-radius: 15px;padding: 2PX;">
                    <option value="Hospital">Hospitals</option>
                    <option value="apollo">Apollo</option>
                    <option value="sarkari">Sarkari</option>
                    <option value="zydus">Zydus</option>
                </select>
            </div>
            <div>
                <select name="language" id="language" style="height: 35px;width: 90px; font-size: 15px;border-radius: 15px;padding: 2PX;"> 
                    <option value="english">english</option>
                    <option value="hindi">Hindi</option>
                    <option value="gujarati">Gujarati</option>
                </select>
            </div>
            <!-- <h1 style="font-size: 30px;margin-top: 10px;margin-right: 20px;">Integrated Hospital Navigation and Patient Info Portal</h1> -->
            <div id="search_container">
                <input type="search" id="search" placeholder="Search..."
                    style="width: 300px; height: 35px;border-radius: 10px;padding-left: 10px;">
                <button id="search_button" style="width: 50px; height: 35px; border-radius: 10px;background-color: #b8d2e3;">search</button>
            </div>
        </div>
    </header>
    <main id="main_container">
        <div class="main_div">
            <div class="sidebar_container">
                    <div class="hr_line">
                        <img src="3line.svg" style="height: 35px; width: 35px;">
                    </div>
                    <div class="hr_line">
                        <a href="/login">Patient Detail form</a>
                    </div>
                    <div class="hr_line">
                        <a href="/family_login">Patient Info Access Portal </a>
                    </div>
                    <div class="hr_line">
                        <a href="#">Admin Login</a>
                    </div>
                    <div class="hr_line">
                        <a href="#">Dashboard</a>
                    </div>
            </div>
            <div id="content_container">
                
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
